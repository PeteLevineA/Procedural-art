<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Petrova Scope — Procedural Particle Animation</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="immersive">
  <!-- Full-screen hero container; the canvas is appended here. -->
  <div id="stage" class="stage-full" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="overlay">
    <a class="back" href="../index.html">← All animations</a>
    <div class="info">
      <h1>Petrova Scope</h1>
      <p>
        A 100% procedural OLED particle field — ultraviolet, electric-blue and cyan
        charged particles flowing through a curl-noise turbulence into luminous
        plasma clusters. No images, no sprites, no pre-rendered assets.
      </p>
    </div>
  </div>

  <script type="module">
    import { getAnimation } from '../src/animations.js';
    const entry = getAnimation('petrova');
    entry.mount(document.getElementById('stage'), { previewLoop: false });
  </script>
</body>
</html>
